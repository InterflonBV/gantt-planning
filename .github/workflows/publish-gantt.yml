
name: Publish stakeholder Gantt data

on:
  repository_dispatch:
    types: [publish-stakeholder-gantt]

permissions:
  contents: write

concurrency:
  group: stakeholder-gantt-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and write public dataset
        env:
          GANTT_DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python3 validate_and_publish.py

      - name: Commit new planning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gantt-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish validated stakeholder Gantt"
            git push
          fi
